<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DM Schedule</title>
<meta name="description" content="Schedule and tasks of the Office of the Division Manager">
<meta name="theme-color" content="#0b4f2a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DM Schedule">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  html,body{margin:0;height:100%;background:#0b4f2a;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  body{display:flex;flex-direction:column}
  .hidden{display:none!important}
  #bar{display:flex;align-items:center;gap:10px;background:#fff8e1;color:#4a3700;border-bottom:3px solid #f2b705;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));font-size:15px}
  #bar img{width:34px;height:34px;border-radius:8px;flex:0 0 34px}
  #bar .t{flex:1;min-width:0;line-height:1.3}
  #bar b{display:block;font-size:15.5px}
  #bar button{font:inherit;border:0;border-radius:9px;padding:9px 14px;font-weight:700;cursor:pointer}
  #btnInstall{background:#0b4f2a;color:#fff}
  #btnClose{background:transparent;color:#6b5a1e;font-size:22px;padding:4px 8px}
  #app{flex:1;width:100%;border:0;display:block;background:#f2f4f3}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#0b4f2a;color:#fff;z-index:5;text-align:center;padding:24px}
  #splash img{width:96px;height:96px;border-radius:22px}
  #splash .m{font-size:17px;opacity:.9}
  #splash button{font:inherit;font-size:16px;font-weight:700;border:0;border-radius:10px;padding:12px 22px;background:#f2b705;color:#2b2100;cursor:pointer}
  .spin{width:34px;height:34px;border-radius:50%;border:4px solid rgba(255,255,255,.3);border-top-color:#fff;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<!-- Install suggestion (Android / computer: one tap; iPhone: short instructions) -->
<div id="bar" class="hidden">
  <img src="icons/icon-192.png" alt="">
  <div class="t" id="barText"><b>Install DM Schedule</b>Open it like an app, without the browser bar.</div>
  <button id="btnInstall" class="hidden">Install</button>
  <button id="btnClose" aria-label="Close">×</button>
</div>

<iframe id="app" title="DM Schedule" allow="clipboard-write; web-share"></iframe>

<div id="splash">
  <img src="icons/icon-192.png" alt="">
  <div class="spin" id="spin"></div>
  <div class="m" id="splashMsg">Loading DM Schedule…</div>
  <button id="btnRetry" class="hidden">Try again</button>
</div>

<script>
/* ==========================================================================
   SET THIS ONCE: your Apps Script web app link (Deploy > Manage deployments).
   It ends with /exec
   ========================================================================== */
var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxpAxD7RZbrWP3c2xDB6mbR71RdAgfNKLhSJadph8Ug0_RI7IZS1M397YCiZsU6VOmcJQ/exec';

(function(){
  var frame = document.getElementById('app');
  var splash = document.getElementById('splash');
  var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var deferredPrompt = null;

  function msg(text, retry){
    document.getElementById('splashMsg').textContent = text;
    document.getElementById('spin').classList.toggle('hidden', !!retry);
    document.getElementById('btnRetry').classList.toggle('hidden', !retry);
    splash.classList.remove('hidden');
  }

  function load(){
    if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec/.test(WEB_APP_URL)){
      msg('Setup needed: put the web app link in index.html (WEB_APP_URL).', false);
      document.getElementById('spin').classList.add('hidden');
      return;
    }
    if (!navigator.onLine){ msg('No internet connection. Connect to Wi-Fi or mobile data, then tap Try again.', true); return; }
    msg('Loading DM Schedule…', false);
    frame.src = WEB_APP_URL + (WEB_APP_URL.indexOf('?') < 0 ? '?' : '&') + 'shell=1';
  }
  frame.addEventListener('load', function(){ if (frame.src) splash.classList.add('hidden'); });
  document.getElementById('btnRetry').addEventListener('click', load);
  window.addEventListener('online', function(){ if (!splash.classList.contains('hidden')) load(); });
  window.addEventListener('offline', function(){ /* the app shows its own "No internet" message on actions */ });

  /* ---------- install suggestion ---------- */
  function dismissed(){ try { return Date.now() < +localStorage.getItem('dmInstallHideUntil'); } catch(e){ return false; } }
  function hideBar(days){
    document.getElementById('bar').classList.add('hidden');
    if (days) try { localStorage.setItem('dmInstallHideUntil', String(Date.now() + days * 864e5)); } catch(e){}
  }
  document.getElementById('btnClose').addEventListener('click', function(){ hideBar(14); });

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredPrompt = e;
    if (standalone || dismissed()) return;
    document.getElementById('btnInstall').classList.remove('hidden');
    document.getElementById('bar').classList.remove('hidden');
  });
  document.getElementById('btnInstall').addEventListener('click', function(){
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(){ deferredPrompt = null; hideBar(0); });
  });
  window.addEventListener('appinstalled', function(){ hideBar(3650); });

  if (isIOS && !standalone && !dismissed()){
    document.getElementById('barText').innerHTML = '<b>Install DM Schedule</b>Tap the <b style="display:inline">Share</b> button ' +
      '<span aria-hidden="true">(□↑)</span>, then <b style="display:inline">Add to Home Screen</b>.';
    document.getElementById('bar').classList.remove('hidden');
  }

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
  load();
})();
</script>
</body>
</html>
